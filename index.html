<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Airline Reservation System</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f4f8;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
      margin: auto;
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }
    label {
      font-weight: bold;
      display: block;
      margin-top: 15px;
    }
    input, select, button {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    button {
      width: 50%;
      background-color: #007bff;
      color: white;
      font-weight: bold;
      margin-top: 20px;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover {
      background-color: #0056b3;
    }
    #sub {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
    }
    .confirmation {
      font-size: 15px;
      margin-top: 20px;
      padding: 15px;
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
      border-radius: 8px;
      display: none;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Airline Reservation</h2>
  <form id="reservationForm">
    <label for="flight">Select Flight:</label>
    <select id="flight" required>
      <option value="" disabled selected hidden>-- Choose a Flight --</option>
      <option value="Kolkata to Bombay|6500">Kolkata to Bombay - ₹6500</option>
      <option value="Mumbai to Uppal|4800">Mumbai to Uppal - ₹4800</option>
      <option value="Maldives to Chennai|12000">Maldives to Chennai - ₹12000</option>
      <option value="Hyderabad to Delhi|7300">Hyderabad to Delhi - ₹7300</option>
      <option value="Ongole to Mahabubnagar|3000">Ongole to Mahabubnagar - ₹3000</option>
      <option value="Rajahmundry to Vijayawada|2900">Rajahmundry to Vijayawada - ₹2900</option>
      <option value="Pakistan to USA|35000">Pakistan to USA - ₹35000</option>
      <option value="Bangalore to Chennai|4000">Bangalore to Chennai - ₹4000</option>
      <option value="Delhi to Chennai|5000">Delhi to Chennai - ₹5000</option>
    </select>

    <label for="name">Passenger Name:</label>
    <input type="text" id="name" required>

    <label for="email">Email Address:</label>
    <input type="email" id="email" required>

    <label for="seats">Number of Seats:</label>
    <input type="number" id="seats" min="1" max="10" value="1" required>

    <label for="date">Select Date:</label>
    <input type="date" id="date" required>

    <label for="time">Select Time:</label>
    <input type="time" id="time" required>

    <div id="sub">
      <button type="button" id="bookNowBtn">Book Now, Pay Later</button>
      <button type="submit">Pay Now</button>
    </div>

    <div class="confirmation" id="confirmationMessage">
      ✅ Reservation successful! You can pay later before boarding. A confirmation email will be sent shortly.
    </div>

    <label id="reserlabel" for="reservationId" style="display: none;">Enter Reservation ID (for Pay Now):</label>
    <input type="text" id="reservationId" placeholder="Enter your reservation ID" style="display: none;">
    <button id="reservesub" type="button" style="display: none;">Pay Now</button>
  </form>
</div>

<script>
  function run(){
    function capitalizeName(name) {
  return name
    .toLowerCase()
    .split(' ')
    .map(word => word.charAt(0).toUpperCase() + word.slice(1))
    .join(' ');
}

  // Prepare reservation details

    const reservationData = {
      name: capitalizeName(document.getElementById('name').value),
      email: document.getElementById('email').value,
      flight: document.getElementById('flight').value.split("|")[0],
      price: document.getElementById('flight').value.split("|")[1],
      seats: document.getElementById('seats').value,
      date: document.getElementById('date').value,
      time: document.getElementById('time').value,
      ticketno: generateReservationID(), // Generate a unique ticket number
      reservationID: reservationID
    };

    // Get reservations from localStorage, or initialize an empty array if none exist
    let reservations = JSON.parse(localStorage.getItem('reservations')) || [];

    
    // Save the new reservation
   reservations.push(reservationData);
localStorage.setItem('reservations', JSON.stringify(reservations));
localStorage.setItem('reservationData', JSON.stringify(reservationData));
 }
  const form = document.getElementById('reservationForm');
  const confirmationMessage = document.getElementById('confirmationMessage');
  const reservationIdInput = document.getElementById('reservationId');
  const reservationID = generateReservationID();

  // Get today's date in yyyy-mm-dd format
  const dateInput = document.getElementById('date');
const timeInput = document.getElementById('time');

// Set today's date as min
const today = new Date().toISOString().split('T')[0];
dateInput.setAttribute('min', today);

// Update time constraint dynamically based on selected date
dateInput.addEventListener('change', () => {
  const selectedDate = dateInput.value;
  const now = new Date();
  const currentDate = now.toISOString().split('T')[0];

  if (selectedDate === currentDate) {
    const currentTime = now.toTimeString().slice(0, 5);
    timeInput.setAttribute('min', currentTime);
  } else {
    timeInput.removeAttribute('min'); // Allow full range for future dates
  }
});


  // Show confirmation on 'Book Now, Pay Later' button click
  document.getElementById('bookNowBtn').addEventListener('click', function(e) {
    
    e.preventDefault(); // Prevent form submission
    // ✅ Validate the form before proceeding
if (!form.checkValidity()) {
  alert("Please fill in all required fields correctly.");
  return;
}
 run();
 
     // ✅ added

    confirmationMessage.style.display = 'block'; // Show the confirmation message
    confirmationMessage.innerHTML = `✅ Reservation successful! Your Reservation ID is: ${reservationID}. You can pay later before boarding. A confirmation email will be sent shortly.`;

    // Hide the 'Pay Now' button and show the Reservation ID input for payment
    document.querySelector('button[type="submit"]').style.display = 'none';
    reservationIdInput.style.display = 'inline';
    reservationIdInput.value = reservationID; // Pre-fill the Reservation ID input
    document.getElementById('reserlabel').style.display = 'inline';
    document.getElementById('reservesub').style.display = 'inline';
  });

  // Handle form submission on 'Pay Now' button click
  form.addEventListener('submit', function (e) {
    e.preventDefault(); // Prevent default form submission

    run(); // Call the function to save reservation data
    // Redirect to payment page (if required)
    window.location.href = 'payment.html'; // Redirect to payment page
  });

  // Function to generate a unique reservation ID with 4 letters (uppercase) and 6 digits
  function generateReservationID() {
    const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const numbers = '0123456789';

    let reservationID = '';
    
    // Generate 4 random uppercase letters
    for (let i = 0; i < 4; i++) {
      reservationID += letters.charAt(Math.floor(Math.random() * letters.length));
    }

    // Generate 6 random digits
    for (let i = 0; i < 6; i++) {
      reservationID += numbers.charAt(Math.floor(Math.random() * numbers.length));
    }

    return reservationID;
  }

  // When the user clicks on the 'Pay Now' button after entering the reservation ID
  document.getElementById('reservesub').addEventListener('click', function(e) {
    e.preventDefault();
    const enteredID = reservationIdInput.value.trim();
    const reservations = JSON.parse(localStorage.getItem('reservations')) || [];

    const reservation = reservations.find(r => r.reservationID === enteredID);
    
    if (reservation) {
      alert("Your reservation has been confirmed.");
      window.location.href = 'payment.html'; // Redirect to payment page if the IDs match
    } else {
      alert('Invalid Reservation ID. Please try again.');
    }
  });
  // ✅ If returning from 'Edit', populate form with previous data
window.addEventListener('DOMContentLoaded', () => {
  const editMode = localStorage.getItem('editMode');
  const data = JSON.parse(localStorage.getItem('reservationData'));

  if (editMode === 'true' && data) {
    document.getElementById('name').value = data.name;
    document.getElementById('email').value = data.email;
    document.getElementById('seats').value = data.seats;
    document.getElementById('date').value = data.date;
    document.getElementById('time').value = data.time;

    // Set selected flight
    const options = document.getElementById('flight').options;
    for (let i = 0; i < options.length; i++) {
      if (options[i].value.includes(data.flight)) {
        options[i].selected = true;
        break;
      }
    }

    // Clear edit mode so it's not reused
    // localStorage.removeItem('editMode');
  }
});

</script>

</body>
</html>
